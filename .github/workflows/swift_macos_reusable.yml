name: "Swift macOS Reusable"

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  toolchains:
    name: "Toolchains on ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'NikSativa/.github' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .ci
      - name: Find release Xcode toolchains
        shell: bash
        run: .ci/scripts/ci-toolchains.sh "${{ matrix.runner }}" . "${{ runner.temp }}/toolchains"
      - uses: actions/upload-artifact@v7
        with:
          name: toolchains-${{ matrix.runner }}
          path: ${{ runner.temp }}/toolchains
          if-no-files-found: error
          retention-days: 1

  plan:
    name: "Plan"
    needs: toolchains
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'NikSativa/.github' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .ci
      - uses: actions/download-artifact@v8
        with:
          pattern: toolchains-*
          path: ${{ runner.temp }}/toolchains
      - name: Resolve supported platforms and Swift versions
        id: matrix
        shell: bash
        run: |
          matrix=$(.ci/scripts/ci-job-matrix.sh "${{ runner.temp }}/toolchains")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: "${{ matrix.platform }} Swift ${{ matrix.swift }} (${{ matrix.action }})"
    needs: plan
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: "${{ matrix.xcode }}/Contents/Developer"
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository || 'NikSativa/.github' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .ci
      - name: Cache Swift packages
        if: matrix.platform == 'macOS'
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-swift${{ matrix.swift }}-${{ hashFiles('**/Package.resolved') }}
      - name: Cache Xcode
        if: matrix.platform != 'macOS'
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ matrix.platform }}-swift${{ matrix.swift }}-${{ hashFiles('**/Package.resolved') }}
      - name: Lint
        run: swift package resolve
      - name: Build
        if: matrix.platform == 'macOS'
        run: swift build -v | xcbeautify --renderer github-actions
      - name: Test
        if: matrix.platform == 'macOS'
        run: swift test -v | xcbeautify --renderer github-actions
      - name: Rerun tests serially with raw output
        if: failure() && matrix.platform == 'macOS'
        run: swift test --no-parallel 2>&1 | tail -n 400
      - name: "xcodebuild ${{ matrix.action }} on ${{ matrix.platform }}"
        if: matrix.platform != 'macOS'
        run: .ci/scripts/ci-xcodebuild.sh "${{ matrix.action }}" "${{ matrix.platform }}" . | xcbeautify --renderer github-actions
      - name: Test coverage
        if: matrix.coverage
        run: swift test --enable-code-coverage
