name: "Swift macOS Reusable"

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: "${{ matrix.platform }} ${{ matrix.xcode }} ${{ matrix.swift }}"
    runs-on: ${{ matrix.runsOn }}
    env:
      DEVELOPER_DIR: "/Applications/${{ matrix.xcode }}.app/Contents/Developer"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 5.10
          - platform: "macOS"
            xcode: "Xcode_15.4"
            runsOn: macOS-14
            swift: "5.10"
            outputFilter: xcbeautify --renderer github-actions
          # Swift 6.0
          - platform: "macOS"
            xcode: "Xcode_16.1"
            runsOn: macOS-15
            swift: "6.0"
            outputFilter: xcbeautify --renderer github-actions
          # Swift 6.1
          - platform: "macOS"
            xcode: "Xcode_16.3"
            runsOn: macOS-15
            swift: "6.1"
            outputFilter: xcbeautify --renderer github-actions
          # Swift 6.2
          - platform: "macOS"
            xcode: "Xcode_16.4"
            runsOn: macOS-15
            swift: "6.2"
            outputFilter: xcbeautify --renderer github-actions
          # Platforms (build-only, swift test is macOS-only)
          - platform: "iOS"
            xcode: "Xcode_16.4"
            runsOn: macOS-15
            swift: "6.2"
            outputFilter: xcbeautify --renderer github-actions
          - platform: "tvOS"
            xcode: "Xcode_16.4"
            runsOn: macOS-15
            swift: "6.2"
            outputFilter: xcbeautify --renderer github-actions
          - platform: "watchOS"
            xcode: "Xcode_16.4"
            runsOn: macOS-15
            swift: "6.2"
            outputFilter: xcbeautify --renderer github-actions
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
      - name: Cache Xcode
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ matrix.xcode }}
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
      - name: Lint
        run: swift package resolve
      - name: "Build ${{ matrix.platform }} ${{ matrix.xcode }} ${{ matrix.swift }}"
        run: swift build -v | ${{ matrix.outputFilter }}
      - name: "Test ${{ matrix.platform }} ${{ matrix.xcode }} ${{ matrix.swift }}"
        run: swift test -v | ${{ matrix.outputFilter }}
      - name: Test coverage
        if: matrix.swift != '5.10' && matrix.swift != '6.0' && matrix.platform == 'macOS'
        run: swift test --enable-code-coverage
